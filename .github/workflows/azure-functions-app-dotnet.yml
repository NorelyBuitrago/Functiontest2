name: CI/CD Azure Functions (.NET 9 isolated)

on:
  push:
    branches: [ "main" ]         # <- cambia si tu rama es otra (ej. master)
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: norely-learn-func01     # <- tu Function App en Azure
  PROJECT_PATH: ./RegisterMes/RegisterMes.csproj  # <- ruta real a tu .csproj
  PUBLISH_DIR: ./publish
  DOTNET_VERSION: '9.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
